<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!-- Mainframe chassis -->
  <rect x="2" y="4" width="20" height="16" rx="1" fill="#1e293b" stroke="#3b82f6" stroke-width="0.5"/>
  
  <!-- Front panel -->
  <rect x="3" y="5" width="18" height="14" rx="0.5" fill="#374151"/>
  
  <!-- Drive bays -->
  <rect x="4" y="6" width="7" height="2" rx="0.2" fill="#4b5563" stroke="#6b7280" stroke-width="0.3"/>
  <rect x="4" y="8.5" width="7" height="2" rx="0.2" fill="#4b5563" stroke="#6b7280" stroke-width="0.3"/>
  <rect x="4" y="11" width="7" height="2" rx="0.2" fill="#4b5563" stroke="#6b7280" stroke-width="0.3"/>
  <rect x="4" y="13.5" width="7" height="2" rx="0.2" fill="#4b5563" stroke="#6b7280" stroke-width="0.3"/>
  <rect x="4" y="16" width="7" height="2" rx="0.2" fill="#4b5563" stroke="#6b7280" stroke-width="0.3"/>
  
  <!-- Control panel -->
  <rect x="12.5" y="6" width="8" height="12" rx="0.3" fill="#1f2937"/>
  
  <!-- Status lights -->
  <circle cx="13.5" cy="7.5" r="0.3" fill="#22c55e"/>
  <circle cx="14.5" cy="7.5" r="0.3" fill="#eab308"/>
  <circle cx="15.5" cy="7.5" r="0.3" fill="#ef4444"/>
  <circle cx="16.5" cy="7.5" r="0.3" fill="#3b82f6"/>
  
  <!-- Display screen -->
  <rect x="13" y="9" width="7" height="4" rx="0.2" fill="#000000" stroke="#4b5563" stroke-width="0.2"/>
  <rect x="13.2" y="9.2" width="6.6" height="3.6" fill="#0f172a"/>
  
  <!-- Screen text lines -->
  <line x1="13.5" y1="10" x2="19.5" y2="10" stroke="#22c55e" stroke-width="0.1"/>
  <line x1="13.5" y1="10.5" x2="18" y2="10.5" stroke="#22c55e" stroke-width="0.1"/>
  <line x1="13.5" y1="11" x2="19" y2="11" stroke="#22c55e" stroke-width="0.1"/>
  <line x1="13.5" y1="11.5" x2="17" y2="11.5" stroke="#22c55e" stroke-width="0.1"/>
  <line x1="13.5" y1="12" x2="19.5" y2="12" stroke="#22c55e" stroke-width="0.1"/>
  
  <!-- Control buttons -->
  <rect x="13.5" y="14" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  <rect x="15.5" y="14" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  <rect x="17.5" y="14" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  
  <rect x="13.5" y="15.2" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  <rect x="15.5" y="15.2" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  <rect x="17.5" y="15.2" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  
  <rect x="13.5" y="16.4" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  <rect x="15.5" y="16.4" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  <rect x="17.5" y="16.4" width="1.5" height="0.8" rx="0.1" fill="#374151" stroke="#6b7280" stroke-width="0.1"/>
  
  <!-- IBM logo area (simplified) -->
  <rect x="4.5" y="16.3" width="2" height="1" fill="#1e40af"/>
  <text x="5.5" y="17" font-family="monospace" font-size="0.6" text-anchor="middle" fill="white">IBM</text>
</svg>